name: Keep Streamlit apps awake

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit apps
        env:
          APP_URLS: ${{ secrets.APP_URLS }}
        run: |
          python - <<'EOF'
          import os
          from playwright.sync_api import sync_playwright

          urls = [u.strip() for u in os.environ["APP_URLS"].split(",") if u.strip()]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for url in urls:
                  page = browser.new_page()
                  try:
                      page.goto(url, wait_until="domcontentloaded", timeout=60000)
                      try:
                          page.get_by_role(
                              "button", name="Yes, get this app back up!"
                          ).click(timeout=10000)
                          print(f"{url}: was asleep, wake button clicked")
                      except Exception:
                          print(f"{url}: already awake")
                      page.wait_for_timeout(30000)
                  except Exception as e:
                      print(f"{url}: FAILED - {e}")
                  page.close()
              browser.close()
          EOF
